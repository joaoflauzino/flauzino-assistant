x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    platform: linux/arm64
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    logging: *default-logging
    networks:
      - default

  finance_api:
    image: flauzino-assistant/finance_api:v1.0.0
    build:
      context: ../
      dockerfile: finance_api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - GRAPH_SERVICE_URL=http://graph_api:8002
    depends_on:
      - db
    logging: *default-logging
    networks:
      - default

  agent_api:
    image: flauzino-assistant/agent_api:v1.0.0
    build:
      context: ../
      dockerfile: agent_api/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - FINANCE_SERVICE_URL=http://finance_api:8000
      - GRAPH_SERVICE_URL=http://graph_api:8002
      - MCP_SERVER_URL=http://graph_api:8002
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-gpt-6-luna}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flauzino}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-assistant}
    depends_on:
      - db
      - finance_api
    logging: *default-logging
    networks:
      - default

  graph_api:
    image: flauzino-assistant/graph_api:v1.0.0
    build:
      context: ../
      dockerfile: graph_api/Dockerfile
    ports:
      - "8002:8002"
    logging: *default-logging
    networks:
      - default

  frontend:
    image: flauzino-assistant/frontend:v1.0.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - finance_api
    logging: *default-logging
    networks:
      - default

  telegram_bot:
    image: flauzino-assistant/telegram_bot:v1.0.0
    build:
      context: ../
      dockerfile: telegram_api/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AGENT_API_URL=http://agent_api:8001
      - FINANCE_SERVICE_URL=http://finance_api:8000
      - GRAPH_SERVICE_URL=http://graph_api:8002
      - MCP_SERVER_URL=http://graph_api:8002
      - ALLOWED_TELEGRAM_USERNAMES=${ALLOWED_TELEGRAM_USERNAMES}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flauzino}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-assistant}
    depends_on:
      - db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - default

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    logging: *default-logging
    networks:
      - default

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging
    networks:
      - default

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
