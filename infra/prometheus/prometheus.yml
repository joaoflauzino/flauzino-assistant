global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "flauzino_apis"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "finance_api:8000"
          - "agent_api:8001"
          - "graph_api:8002"
        labels:
          app: "flauzino-assistant"
