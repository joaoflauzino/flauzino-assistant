services:
  db:
    image: postgres:17-alpine
    platform: linux/arm64
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default

  finance_api:
    image: flauzino-assistant/finance_api:v1.0.0
    build:
      context: ../
      dockerfile: finance_api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - default

  agent_api:
    image: flauzino-assistant/agent_api:v1.0.0
    build:
      context: ../
      dockerfile: agent_api/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - FINANCE_SERVICE_URL=http://finance_api:8000
      - MCP_SERVER_URL=http://mcp_server:8002
      - GEMINI_API_KEY=${GOOGLE_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.0-flash-exp}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flauzino}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-assistant}
    depends_on:
      - db
      - finance_api
    networks:
      - default

  mcp_server:
    image: flauzino-assistant/mcp_server:v1.0.0
    build:
      context: ../
      dockerfile: mcp_server/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - FINANCE_SERVICE_URL=http://finance_api:8000
    depends_on:
      - finance_api
    networks:
      - default

  frontend:
    image: flauzino-assistant/frontend:v1.0.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - finance_api
    networks:
      - default

  telegram_bot:
    image: flauzino-assistant/telegram_bot:v1.0.0
    build:
      context: ../
      dockerfile: telegram_api/Dockerfile
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AGENT_API_URL=http://agent_api:8001
      - FINANCE_SERVICE_URL=http://finance_api:8000
      - MCP_SERVER_URL=http://mcp_server:8002
      - ALLOWED_TELEGRAM_USERNAMES=${ALLOWED_TELEGRAM_USERNAMES}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flauzino}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-assistant}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_data:

